<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeeReal - Цифровая Пасека 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans">

    <div id="auth-screen" class="fixed inset-0 bg-amber-500 z-[100] flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-md">
            <h1 class="text-5xl text-center mb-2">🐝</h1>
            <h2 class="text-2xl font-bold text-center mb-6 text-amber-600">BeeReal Connect</h2>
            <div class="space-y-4">
                <input type="text" id="username" placeholder="Ваше имя" class="w-full p-4 border rounded-xl outline-none focus:ring-2 ring-amber-300">
                <select id="user-role" class="w-full p-4 border rounded-xl outline-none bg-white">
                    <option value="player">Я Игрок (управляю ульем)</option>
                    <option value="beekeeper">Я Пчеловод (работаю на поле)</option>
                </select>
                <button onclick="login()" class="w-full bg-amber-600 text-white py-4 rounded-xl font-bold hover:bg-amber-700 transition transform active:scale-95">Войти в систему</button>
            </div>
            <p class="text-[10px] text-center mt-4 text-slate-400 uppercase tracking-widest font-bold">Concept by Telefarm Tech</p>
        </div>
    </div>

    <div id="main-app" class="hidden min-h-screen flex flex-col">
        <nav class="bg-white border-b p-4 flex justify-between items-center shadow-sm sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <span class="text-xl">🐝</span>
                <span class="text-xl font-extrabold text-amber-600 tracking-tighter">BEEREAL</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="text-right">
                    <div id="display-name" class="text-sm font-bold text-slate-800 leading-none"></div>
                    <span id="user-status" class="text-[10px] text-amber-600 font-bold uppercase">Level 1</span>
                </div>
                <button onclick="logout()" class="bg-red-50 text-red-500 px-3 py-1 rounded-lg text-xs font-bold hover:bg-red-500 hover:text-white transition">ВЫЙТИ</button>
            </div>
        </nav>

        <main class="max-w-6xl mx-auto w-full p-4 grid grid-cols-1 lg:grid-cols-3 gap-6 flex-1">
            
            <div class="lg:col-span-2 space-y-6">
                <div id="player-view" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-amber-100">
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800">Улей №142</h2>
                            <p class="text-sm text-slate-500">Место: Горный Алтай</p>
                        </div>
                        <div class="bg-amber-100 text-amber-700 p-2 rounded-xl text-center min-w-[80px]">
                            <span class="block text-xs font-bold uppercase">Мёд</span>
                            <span id="honey-val" class="text-xl font-black">0.0</span><span class="text-sm">/5кг</span>
                        </div>
                    </div>

                    <div class="w-full bg-slate-100 h-4 rounded-full overflow-hidden mb-8 border-inner shadow-inner">
                        <div id="honey-bar" class="bg-gradient-to-r from-amber-400 to-yellow-300 h-full transition-all duration-1000 shadow-[0_0_15px_rgba(251,191,36,0.5)]" style="width: 0%"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="sendAction('🌱 Посадить медоносы')" class="group p-6 bg-white border-2 border-amber-100 rounded-3xl hover:border-amber-400 hover:shadow-xl transition-all">
                            <span class="text-3xl block mb-2 group-hover:scale-125 transition">🌱</span>
                            <span class="font-bold text-slate-700">Посадить цветы</span>
                        </button>
                        <button onclick="sendAction('💧 Наполнить поилки')" class="group p-6 bg-white border-2 border-blue-100 rounded-3xl hover:border-blue-400 hover:shadow-xl transition-all">
                            <span class="text-3xl block mb-2 group-hover:scale-125 transition">💧</span>
                            <span class="font-bold text-slate-700">Дать воды</span>
                        </button>
                    </div>
                </div>

                <div id="beekeeper-view" class="hidden bg-white p-6 rounded-3xl shadow-sm border border-slate-200">
                    <h2 class="text-2xl font-black text-slate-800 mb-6">Запросы с пасеки</h2>
                    <div id="task-list" class="space-y-4">
                        <div class="text-center py-10">
                            <div class="animate-spin inline-block w-8 h-8 border-4 border-amber-500 border-t-transparent rounded-full mb-4"></div>
                            <p class="text-slate-400 font-medium">Связь с игроками...</p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl shadow-lg border border-slate-200 flex flex-col h-[600px] overflow-hidden">
                <div class="p-4 bg-slate-800 text-white flex justify-between items-center">
                    <span class="font-bold tracking-tight">LIVE CHAT</span>
                    <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
                </div>
                
                <div id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-4 bg-slate-50 flex flex-col">
                    </div>
                
                <div class="p-4 bg-white border-t">
                    <div id="img-preview-box" class="hidden mb-3 relative inline-block">
                        <img id="preview-img" src="" class="h-24 w-24 object-cover rounded-2xl border-4 border-amber-400 shadow-lg">
                        <button onclick="cancelImg()" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center font-bold text-xs shadow-md">✕</button>
                    </div>
                    <div class="flex gap-2">
                        <label class="p-4 bg-slate-100 rounded-2xl cursor-pointer hover:bg-amber-100 transition">
                            📷 <input type="file" id="file-input" class="hidden" accept="image/*" onchange="handleImg()">
                        </label>
                        <input type="text" id="chat-input" placeholder="Напишите сообщение..." class="flex-1 border-none bg-slate-100 rounded-2xl px-4 outline-none focus:ring-2 ring-amber-300 transition">
                        <button onclick="sendMessage()" class="bg-amber-500 text-white px-6 rounded-2xl font-bold hover:bg-amber-600 transition shadow-md active:scale-90">➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- CONFIG ---
        // Чтобы коннект работал между устройствами, вставьте данные вашего Firebase:
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT",
            appId: "YOUR_APP_ID"
        };
        
        let isOnline = false;
        let db;
        try {
            if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
                firebase.initializeApp(firebaseConfig);
                db = firebase.database();
                isOnline = true;
            }
        } catch(e) { console.warn("Работаем в локальном режиме. Для коннекта нужен Firebase."); }

        let user = null;

        // ВХОД
        function login() {
            const nameInput = document.getElementById('username');
            if(!nameInput.value) return alert("Введите ваше имя");
            
            user = { 
                name: nameInput.value, 
                role: document.getElementById('user-role').value 
            };
            
            document.getElementById('auth-screen').classList.add('hidden');
            document.getElementById('main-app').classList.remove('hidden');
            document.getElementById('display-name').innerText = user.name;
            document.getElementById('user-status').innerText = user.role === 'player' ? 'Digital Farmer' : 'Pro Beekeeper';

            if(user.role === 'player') {
                document.getElementById('player-view').classList.remove('hidden');
            } else {
                document.getElementById('beekeeper-view').classList.remove('hidden');
            }

            if(isOnline) syncData();
            else alert("Внимание: Firebase не настроен. Кнопки работают, но данные не синхронизируются между игроками.");
        }

        // ВЫХОД (ИСПРАВЛЕННЫЙ)
        function logout() {
            if(confirm("Вы уверены, что хотите выйти?")) {
                location.reload(); // Это самый надежный способ сбросить все сессии и Firebase-слушатели
            }
        }

        // --- ЛОГИКА СИНХРОНИЗАЦИИ ---
        function syncData() {
            // Чат
            db.ref('messages').limitToLast(20).on('child_added', (snap) => {
                drawMessage(snap.val());
            });

            // Задания
            db.ref('tasks').on('value', (snap) => {
                const data = snap.val() ? Object.entries(snap.val()) : [];
                const list = document.getElementById('task-list');
                const pending = data.filter(t => t[1].status === 'pending');
                
                list.innerHTML = pending.map(([id, t]) => `
                    <div class="bg-white p-5 rounded-3xl border-2 border-slate-100 flex justify-between items-center shadow-sm hover:border-amber-200 transition">
                        <div>
                            <span class="text-[10px] font-black text-amber-500 uppercase">ЗАКАЗ ОТ ${t.user}</span>
                            <p class="text-lg font-bold text-slate-800">${t.name}</p>
                        </div>
                        <button onclick="completeTask('${id}')" class="bg-green-500 text-white px-6 py-3 rounded-2xl font-bold hover:bg-green-600 transition shadow-lg shadow-green-100">ГОТОВО</button>
                    </div>
                `).join('') || '<div class="text-center py-10 text-slate-400 font-medium">🎉 Все пчелы довольны, заданий нет!</div>';
            });

            // Мёд
            db.ref('honey_status').on('value', (snap) => {
                const val = snap.val() || 0;
                document.getElementById('honey-val').innerText = val.toFixed(1);
                document.getElementById('honey-bar').style.width = Math.min(100, (val / 5 * 100)) + '%';
            });
        }

        function sendAction(name) {
            if(!isOnline) return alert("Необходим Firebase для отправки команды пчеловоду!");
            db.ref('tasks').push({ 
                name, 
                user: user.name, 
                status: 'pending',
                time: Date.now()
            });
            // Имитация сообщения в чат
            sendMessage(`Я отправил задание: ${name}! Пожалуйста, выполните.`);
        }

        function completeTask(id) {
            db.ref('tasks/' + id).update({ status: 'done' });
            db.ref('honey_status').transaction(curr => (curr || 0) + 0.4);
            sendMessage("Задание выполнено в реальности! ✅ Прибавил вам мёда.");
        }

        // --- ЧАТ ---
        function sendMessage(textOverride = null) {
            const input = document.getElementById('chat-input');
            const text = textOverride || input.value;
            const img = document.getElementById('preview-img').src;
            const hasImg = !document.getElementById('img-preview-box').classList.contains('hidden');

            if(!text && !hasImg) return;

            const msg = {
                sender: user.name,
                role: user.role,
                text: text,
                image: hasImg ? img : null,
                time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})
            };

            if(isOnline) db.ref('messages').push(msg);
            else drawMessage(msg); // Тестовый режим

            input.value = "";
            cancelImg();
        }

        function drawMessage(msg) {
            const box = document.getElementById('chat-box');
            const isMe = msg.sender === user.name;
            const div = document.createElement('div');
            div.className = `flex mb-4 ${isMe ? 'justify-end' : 'justify-start'}`;
            
            div.innerHTML = `
                <div class="max-w-[85%] ${isMe ? 'items-end' : 'items-start'} flex flex-col">
                    <span class="text-[9px] font-bold text-slate-400 mb-1 px-2 uppercase">${msg.sender} (${msg.role})</span>
                    <div class="${isMe ? 'bg-amber-500 text-white rounded-2xl rounded-tr-none shadow-amber-100' : 'bg-white text-slate-800 rounded-2xl rounded-tl-none border border-slate-100 shadow-slate-100'} p-3 shadow-md">
                        ${msg.image ? `<img src="${msg.image}" class="rounded-xl mb-2 w-full max-w-[200px] border border-black/5">` : ''}
                        <p class="text-sm font-medium leading-relaxed">${msg.text}</p>
                        <p class="text-[9px] opacity-60 mt-1 text-right">${msg.time}</p>
                    </div>
                </div>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // ФОТО
        function handleImg() {
            const file = document.getElementById('file-input').files[0];
            if(file.size > 500000) return alert("Файл слишком большой! Выберите фото до 500кб");
            const reader = new FileReader();
            reader.onload = (e) => {
                document.getElementById('preview-img').src = e.target.result;
                document.getElementById('img-preview-box').classList.remove('hidden');
            };
            reader.readAsDataURL(file);
        }
        function cancelImg() { document.getElementById('img-preview-box').classList.add('hidden'); }
    </script>
</body>
</html>
